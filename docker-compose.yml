services:
  worldcup-tracker:
    image: "${IMAGE_NAME:-worldcup-tracker:local}"
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
