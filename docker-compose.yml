services:
  worldcup-tracker:
    image: "${IMAGE_NAME:-worldcup-tracker:local}"
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-}"
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - admin-api
    volumes:
      - results_data:/data

  admin-api:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - ./admin-api:/app:ro
      - results_data:/data

volumes:
  results_data:
