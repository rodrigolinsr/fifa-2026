services:
  worldcup-tracker:
    image: "${IMAGE_NAME:-worldcup-tracker:local}"
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-}"
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      ADMIN_BASIC_USER: "${ADMIN_BASIC_USER:-}"
      ADMIN_BASIC_PASS: "${ADMIN_BASIC_PASS:-}"
      FIFA_ROUNDS_URL: "${FIFA_ROUNDS_URL:-https://play.fifa.com/json/fantasy/rounds.json}"
      FIFA_RESULT_SYNC_ENABLED: "${FIFA_RESULT_SYNC_ENABLED:-true}"
      FIFA_RESULT_SYNC_INTERVAL_MS: "${FIFA_RESULT_SYNC_INTERVAL_MS:-60000}"
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - results_data:/data

volumes:
  results_data:
