services:
  worldcup-tracker:
    image: "${IMAGE_NAME:-worldcup-tracker:local}"
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-}"
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_DIR: /data
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - results_data:/data

volumes:
  results_data:
